name: stratumai

services:
  api:
    build:
      context: ./backend
      args:
        PYTHON_VERSION: "3.12"
    image: stratumai:api
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8000"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
    volumes:
      # Reranker model cache, survives image rebuilds.
      - flashrank-cache:/var/cache/flashrank
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}"
    image: stratumai:web
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  flashrank-cache:
