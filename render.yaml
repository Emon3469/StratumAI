services:
  - type: web
    name: stratumai-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: LLM_FALLBACK_ORDER
        value: groq,openai,anthropic,gemini
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_BACKUP_MODELS
        value: openai/gpt-oss-20b
      - key: GROQ_FAST_MODEL
        value: qwen/qwen3.8-27b
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_BACKUP_MODELS
        value: gemini-flash-latest
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: QDRANT_CLUSTER_ENDPOINT
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: stratumai_kb
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIM
        value: "768"
      - key: LOGFIRE_TOKEN
        sync: false
